events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Upstream servers
    upstream fido_server {
        server 127.0.0.1:3000;
    }
    
    upstream ttyd_server {
        server 127.0.0.1:7681;
    }
    
    server {
        listen 8080;
        root /var/www/html;
        
        # Health check endpoint
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        # Landing page with embedded demo at root (exact match)
        location = / {
            try_files /index.html =404;
        }
        
        # Static assets (CSS, JS, images)
        location ~* \.(css|js|png|jpg|ico|svg)$ {
            try_files $uri =404;
        }
        
        # ttyd terminal - proxy with base path preserved
        location /ttyd/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Long timeout for terminal sessions
            proxy_read_timeout 1d;
            
            proxy_pass http://ttyd_server/ttyd/;
            
            # Security headers for iframe embedding
            add_header Content-Security-Policy "frame-ancestors 'self';" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
        
        # API routes go to fido-server (catch-all after specific routes)
        location / {
            proxy_pass http://fido_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
