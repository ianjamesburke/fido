# Run as non-root: keep pid/logs in fido-owned paths (default /run/nginx.pid is not writable).
pid /var/log/fido/nginx.pid;
error_log /var/log/fido/nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version in responses and error pages.
    server_tokens off;

    # Basic per-IP rate limiting shared across proxied locations.
    limit_req_zone $binary_remote_addr zone=fido:10m rate=10r/s;

    # Upstream servers
    upstream fido_server {
        server 127.0.0.1:3000;
    }
    
    upstream ttyd_server {
        server 127.0.0.1:7681;
    }
    
    server {
        listen ${NGINX_PORT};
        root /var/www/html;

        # Site-wide security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Health check endpoint
        location = /health {
            proxy_pass http://fido_server/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Landing page with embedded demo at root (exact match)
        location = / {
            try_files /index.html =404;
        }
        
        # Static assets (CSS, JS, images)
        location ~* \.(css|js|png|jpg|ico|svg)$ {
            try_files $uri =404;
        }
        
        # ttyd terminal - proxy with base path preserved
        location ^~ /ttyd/ws {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 1d;
            proxy_pass http://ttyd_server/ttyd/ws;
        }

        location /ttyd/ {
            limit_req zone=fido burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long timeout for terminal sessions
            proxy_read_timeout 1d;

            proxy_pass http://ttyd_server/ttyd/;

            # A location with its own add_header does NOT inherit the server-level
            # headers, so re-declare them here. X-Frame-Options is intentionally
            # omitted: the same-origin landing page must be able to iframe the
            # terminal, which frame-ancestors below governs instead.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            # Only the production host may iframe the terminal (was wildcard *.up.railway.app).
            add_header Content-Security-Policy "frame-ancestors 'self' https://fido-web-production.up.railway.app;" always;
        }
        
        # API routes go to fido-server (catch-all after specific routes)
        location / {
            limit_req zone=fido burst=20 nodelay;

            proxy_pass http://fido_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
