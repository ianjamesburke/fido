[package]
name = "fido-migrate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Database migration and utility tools for Fido"
repository.workspace = true
homepage.workspace = true
publish = false  # Migration tools are not published to crates.io

[features]
default = []
sqlite-tests = []

[[bin]]
name = "fido-migrate"
path = "src/main.rs"

[[bin]]
name = "check-db"
path = "src/bin/check_db.rs"

[[bin]]
name = "inspect-db"
path = "src/bin/inspect_db.rs"

[[bin]]
name = "follow-hashtags"
path = "src/bin/follow_hashtags.rs"

[[bin]]
name = "test-query"
path = "src/bin/test_query.rs"

[[bin]]
name = "migrate-hashtags"
path = "src/bin/migrate_hashtags.rs"

[[bin]]
name = "sqlite-to-firestore"
path = "src/bin/sqlite_to_firestore.rs"

[dependencies]
# Workspace crates
fido-server = { path = "../fido-server" }
fido-types.workspace = true

# Workspace dependencies
anyhow.workspace = true
clap.workspace = true
uuid.workspace = true
rusqlite.workspace = true
chrono.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
proptest = "1.0"
