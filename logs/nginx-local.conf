worker_processes 1;
error_log /Users/ianburke/Documents/GitHub/fido/./logs/nginx-error.log;
pid /Users/ianburke/Documents/GitHub/fido/./logs/nginx.pid;

events { 
    worker_connections 1024; 
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /Users/ianburke/Documents/GitHub/fido/./logs/nginx-access.log;
    
    upstream fido_server {
        server 127.0.0.1:3000;
    }
    
    upstream ttyd_server {
        server 127.0.0.1:7681;
    }
    
    server {
        listen 8080;
        root /Users/ianburke/Documents/GitHub/fido/web;
        
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        location = / {
            try_files /index.html =404;
        }
        
        location ~* \.(css|js|png|jpg|ico|svg)$ {
            try_files $uri =404;
        }
        
        location /ttyd/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1d;
            proxy_pass http://ttyd_server/ttyd/;
        }
        
        location / {
            proxy_pass http://fido_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
