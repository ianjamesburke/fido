[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:fido-server]
command=/usr/local/bin/fido-server
autostart=true
autorestart=true
stdout_logfile=/var/log/fido-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fido-server_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:ttyd]
# Flags explained:
# -p 7681: Listen on port 7681
# -W: Writable mode - allows interactive terminal input
# -b /ttyd: Base path for reverse proxy routing
# -m 10: Max clients limit to prevent resource exhaustion
# Note: Origin check handled by nginx, not ttyd
command=/usr/bin/ttyd -p 7681 -W -b /ttyd -m 10 /usr/local/bin/fido
environment=FIDO_DEMO_MODE="true"
autostart=true
autorestart=true
stdout_logfile=/var/log/ttyd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/ttyd_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/nginx_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
