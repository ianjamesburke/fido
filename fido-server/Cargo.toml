[package]
name = "fido-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Backend API server for Fido's GitHub repo communities"
repository.workspace = true
homepage.workspace = true
publish = false  # Server is not published to crates.io, only deployed as infrastructure runtime

[features]
default = []
sqlite-tests = []

[dependencies]
fido-types.workspace = true

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true

rusqlite.workspace = true

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

tracing.workspace = true
tracing-subscriber.workspace = true
config = { version = "0.15.19", features = ["toml"] }
dotenv.workspace = true
clap.workspace = true
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
regex = "1.10"
base64.workspace = true
aes-gcm-siv.workspace = true
sha2 = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util = "0.3"
